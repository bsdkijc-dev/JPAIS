services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jpais-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # HTTP REST API (Loopback only)
      - "127.0.0.1:6334:6334"  # gRPC API (Loopback only)
    volumes:
      - /home/ai/JPAIS/vector_database/storage:/qdrant/storage
      - /home/ai/JPAIS/vector_database/snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
